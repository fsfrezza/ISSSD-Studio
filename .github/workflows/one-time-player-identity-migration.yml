name: One-time player identity migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-player-identity-migration.yml'

permissions:
  contents: write

jobs:
  migrate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Migrate canonical project to player-id-v1
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='International-Superstar-Soccer-Deluxe-Plus-projeto.issdproj';
          const d=JSON.parse(fs.readFileSync(path,'utf8'));
          const tv=d?.state?.semantic?.teamsV1;
          if(!tv||!tv.teams)throw new Error('teamsV1 ausente');
          tv.identityModel='player-id-v1';
          for(const [key,team] of Object.entries(tv.teams)){
            const teamId=Number(team?.teamId??key);
            if(!Array.isArray(team.players))continue;
            for(let i=0;i<team.players.length;i++){
              const p=team.players[i],slot=Number(p?.slot)||i+1;
              const baseSlot=Number(p?.baseSlot)||slot;
              p.slot=slot;p.baseSlot=baseSlot;p.playerId=`${teamId}:${baseSlot}`;
            }
          }
          const br=tv.teams['30'];
          if(!br||!Array.isArray(br.players))throw new Error('Brasil teamId 30 ausente');
          const bySlot=s=>br.players.find(p=>Number(p.slot)===s);
          const cafu=bySlot(2),rc=bySlot(5);
          if(!cafu||!rc)throw new Error('Slots 2/5 do Brasil ausentes');
          cafu.custom=cafu.custom&&typeof cafu.custom==='object'?cafu.custom:{};
          rc.custom=rc.custom&&typeof rc.custom==='object'?rc.custom:{};
          cafu.custom.number=2;
          rc.custom.number=6;
          fs.writeFileSync(path,JSON.stringify(d,null,2)+'\n','utf8');
          NODE
      - name: Verify canonical player identity
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('International-Superstar-Soccer-Deluxe-Plus-projeto.issdproj','utf8'));
          const tv=d.state.semantic.teamsV1;
          if(tv.identityModel!=='player-id-v1')throw new Error('identityModel ausente');
          const ps=tv.teams['30'].players;
          const p=s=>ps.find(x=>Number(x.slot)===s);
          if(p(2)?.custom?.number!==2||p(5)?.custom?.number!==6)throw new Error(`Brasil inválido: Cafu=${p(2)?.custom?.number}; R.Carlos=${p(5)?.custom?.number}`);
          if(p(2)?.playerId!=='30:2'||p(5)?.playerId!=='30:5')throw new Error('playerId do Brasil inválido');
          console.log('player-id-v1 verificado; Cafu=2; R.Carlos=6');
          NODE
      - name: Commit canonical project migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add International-Superstar-Soccer-Deluxe-Plus-projeto.issdproj
          git commit -m 'Migrate canonical project to logical player identity'
          git push origin HEAD:main
