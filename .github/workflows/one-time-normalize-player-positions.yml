name: One-time canonical player position normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-normalize-player-positions.yml'

permissions:
  contents: write

jobs:
  normalize-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize canonical project positions and Brazil XI
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='International-Superstar-Soccer-Deluxe-Plus-projeto.issdproj';
          const d=JSON.parse(fs.readFileSync(path,'utf8'));
          const tv=d?.state?.semantic?.teamsV1;
          if(!tv||!tv.teams)throw new Error('teamsV1 ausente');
          const aliases={VOL:'DF-MF',MC:'MF',MO:'MF-FW',AT:'FW',GK:'GO'};
          tv.identityModel='player-id-v1';
          for(const [key,team] of Object.entries(tv.teams)){
            const teamId=Number(team?.teamId??key);
            if(!Array.isArray(team.players))continue;
            for(let i=0;i<team.players.length;i++){
              const p=team.players[i],slot=Number(p?.slot)||i+1;
              let baseSlot=Number(p?.baseSlot);
              if(!Number.isInteger(baseSlot)||baseSlot<1||baseSlot>20){
                const m=String(p?.playerId||'').match(/^(\d+):(\d+)$/);
                baseSlot=m&&Number(m[1])===teamId?Number(m[2]):slot;
              }
              p.slot=slot;p.baseSlot=baseSlot;p.playerId=`${teamId}:${baseSlot}`;
              if(p.custom?.position) p.custom.position=aliases[p.custom.position]||p.custom.position;
            }
          }
          const br=tv.teams['30'];
          if(!br||!Array.isArray(br.players))throw new Error('Brasil teamId 30 ausente');
          const bySlot=s=>br.players.find(p=>Number(p.slot)===s);
          const desired={1:'GO',2:'DF-MF',3:'DF',4:'DF',5:'DF-MF',6:'MF',7:'MF',8:'MF-FW',9:'MF',10:'FW',11:'FW'};
          for(const [s,pos] of Object.entries(desired)){
            const p=bySlot(Number(s));if(!p)throw new Error('Brasil sem slot '+s);
            p.custom=p.custom&&typeof p.custom==='object'?p.custom:{};
            p.custom.position=pos;
          }
          bySlot(2).custom.number=2;
          bySlot(5).custom.number=6;
          d.state.semantic.teamsOverrideModelV1={...(d.state.semantic.teamsOverrideModelV1||{}),schema:'isssd-teams-override-model-v1',version:1,mode:'sparse-overrides',identityModel:'player-id-v1',originalSource:'immutable-base-rom',rule:'field-present-means-override; field-absent-means-preserve-rom'};
          fs.writeFileSync(path,JSON.stringify(d,null,2)+'\n','utf8');
          NODE
      - name: Verify Brazil XI position model
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('International-Superstar-Soccer-Deluxe-Plus-projeto.issdproj','utf8'));
          const tv=d.state.semantic.teamsV1,ps=tv.teams['30'].players,p=s=>ps.find(x=>Number(x.slot)===s);
          const expect={1:'GO',2:'DF-MF',3:'DF',4:'DF',5:'DF-MF',6:'MF',7:'MF',8:'MF-FW',9:'MF',10:'FW',11:'FW'};
          if(tv.identityModel!=='player-id-v1')throw new Error('identityModel inválido');
          for(const [s,pos] of Object.entries(expect))if(p(Number(s))?.custom?.position!==pos)throw new Error(`slot ${s}: ${p(Number(s))?.custom?.position} != ${pos}`);
          if(p(2)?.custom?.number!==2||p(5)?.custom?.number!==6)throw new Error(`camisas inválidas: Cafu=${p(2)?.custom?.number}; R.Carlos=${p(5)?.custom?.number}`);
          console.log('Brasil verificado: Cafu DF-MF #2; R.Carlos DF-MF #6; R.Gaúcho MF-FW.');
          NODE
      - name: Commit canonical project normalization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add International-Superstar-Soccer-Deluxe-Plus-projeto.issdproj
          if git diff --cached --quiet; then echo 'Projeto já normalizado.'; exit 0; fi
          git commit -m 'Normalize player positions and Brazil XI'
          git push origin HEAD:main
